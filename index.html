<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>ระบบสรุปสัญญาเงินให้กู้ยืม</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#e3e6ec;--ac:#1f5fbf;--acb:#e6efff;--ok:#18794e;--okb:#e2f6ec;--wn:#a15c00;--wnb:#fff1d6;--er:#b42318;--erb:#fde7e5;--in:#5b3fc4;--inb:#eee9fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2029;--tx:#e8ebf2;--mu:#98a2b3;--bd:#2c3340;--ac:#7aa7f5;--acb:#1f2e4a;--ok:#5fd09b;--okb:#163325;--wn:#f2b45a;--wnb:#3a2c12;--er:#ff8a80;--erb:#3d1a18;--in:#b6a3ff;--inb:#2a2347;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Noto Sans Thai','Sarabun','Tahoma',system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:18px;margin:0}h1 small{display:block;font-weight:400;color:var(--mu);font-size:12px}
button,input,select,textarea{font:inherit;color:var(--tx)}
.btn{border:1px solid var(--bd);background:var(--card);padding:7px 13px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--acb)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{opacity:.9}
.btn.d{color:var(--er)}.btn.sm{padding:3px 9px;font-size:13px}
main{max-width:1280px;margin:0 auto;padding:16px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 14px}
.k b{display:block;font-size:20px}.k span{color:var(--mu);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 11px;font-size:12.5px}.chip.m{border-color:var(--ac);background:var(--acb)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.f{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:5px 13px;cursor:pointer;font-size:13.5px}.f.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.lay{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:14px;align-items:start}
@media(max-width:860px){.lay{grid-template-columns:1fr}}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.it:hover{border-color:var(--ac)}.it.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--acb)}
.it .t{font-weight:500;margin:3px 0}.it .m{color:var(--mu);font-size:12.5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bd{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12px;font-weight:500}
.s-ปกติ{background:var(--okb);color:var(--ok)}.s-ต่อสัญญา{background:var(--inb);color:var(--in)}.s-ค้างชำระ{background:var(--wnb);color:var(--wn)}.s-ดำเนินคดี{background:var(--erb);color:var(--er)}.s-ปิดบัญชี{background:var(--bg);color:var(--mu)}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.pn h2{font-size:17px;margin:0 0 4px}.pn h3{font-size:14px;margin:18px 0 8px;color:var(--mu);text-transform:none;border-bottom:1px solid var(--bd);padding-bottom:4px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:7px 10px}.kv span{display:block;font-size:12px;color:var(--mu)}.kv b{font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left}.tbl td:last-child,.tbl th:last-child{text-align:right}.tbl tfoot td{font-weight:700}
.rd{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}.rd.cur{border-color:var(--ac);background:var(--acb)}.rd .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:500;margin-bottom:4px}
.rd p{margin:3px 0;font-size:13.5px}.rd p span{color:var(--mu)}
.tx{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:9px 12px;font-size:14px}
.nt{background:var(--wnb);color:var(--tx)}
.em{color:var(--mu);text-align:center;padding:40px 10px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px;z-index:20}
.mb{background:var(--card);border-radius:14px;width:100%;max-width:760px;padding:18px}
.fm label{display:block;font-size:12.5px;color:var(--mu);margin:9px 0 2px}
.fm input,.fm select,.fm textarea{width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px}
.fr{border:1px dashed var(--bd);border-radius:10px;padding:8px 10px;margin:8px 0}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.cal{color:var(--mu);font-size:12px}
#lk .md{background:var(--bg);align-items:center;z-index:50}
</style>
</head>
<body>
<header>
<h1>ระบบสรุปสัญญาเงินให้กู้ยืม<small id="up"></small></h1>
<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span id="msg" class="cal" style="color:var(--er)"></span>
<button class="btn p" id="addb" onclick="edit()">+ เพิ่มสัญญา</button>
<button class="btn p" id="svb" style="display:none" onclick="backupEnc()">💾 สำรองลงไฟล์</button>
<button class="btn" id="lkb" style="display:none" onclick="lock()">🔒 ล็อก</button><button class="btn" id="cpb" style="display:none" onclick="chpw()">เปลี่ยนรหัสผ่าน</button>
<button class="btn" onclick="backup()">ส่งออก (ไม่เข้ารหัส)</button>
<button class="btn" id="impb" onclick="document.getElementById('imp').click()">นำเข้า</button>
<input id="imp" type="file" accept=".json" hidden onchange="imp(this)">
</div>
</header>
<main>
<div class="sum" id="sum"></div>
<div class="chips" id="chips"></div>
<div class="bar"><input type="search" id="q" placeholder="ค้นหา: ชื่อผู้กู้ ผู้ให้กู้ โฉนด ผู้ค้ำ โน้ต..." oninput="S.q=this.value;list()"><span id="fl"></span></div>
<div class="lay"><div id="ls"></div><div id="dt"></div></div>
</main>
<div id="mo"></div><div id="lk" style="display:none"></div>
<script>
const ST=['ปกติ','ต่อสัญญา','ค้างชำระ','ดำเนินคดี','ปิดบัญชี'];
const b=s=>{const[y,m,d]=s.split('-');return (y-543)+'-'+m+'-'+d};
const R=(label,s,e,payDay,method,chk)=>({label,start:b(s),end:b(e),rate:15,payDay,method,chk});
let D={lenders:[],loans:[]},S={q:'',f:'ทั้งหมด',sel:null,del:null},DB=null,RW=true,ready=false;
const fromDoc=d=>{const l={...d};l.amt={};(d.amtList||[]).forEach(x=>l.amt[x.n]=x.v);delete l.amtList;l.rounds=l.rounds||[];l.guar=l.guar||[];return l};
const toDoc=l=>{const d={...l};d.amtList=Object.entries(l.amt||{}).map(([n,v])=>({n,v:+v}));delete d.amt;delete d._new;return JSON.parse(JSON.stringify(d))};
const flash=m=>{$('msg').textContent=m;setTimeout(()=>$('msg').textContent='',4000)};
const wr=p=>p.catch(e=>flash('บันทึกไม่สำเร็จ: '+((e&&e.code)||'error')+' (ต้องมีสิทธิ์แก้ไข)'));
const saveLoan=l=>DB?wr(DB.doc('loans/'+l.id).set(toDoc(l))):(persist(),Promise.resolve());
const saveLenders=()=>DB?wr(DB.doc('meta/lenders').set({list:D.lenders})):(persist(),Promise.resolve());
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null,SALT=null,Q=Promise.resolve(),idle=null,fails=0;
async function derive(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const VK='loanVault',BK='loanLastBackup';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
const MOB=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function pack(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(JSON.stringify(D)));return JSON.stringify({app:'loanVault',v:1,s:b64(SALT),i:b64(iv),d:b64(ct)})}
async function seal(){const txt=await pack();localStorage.setItem(VK,txt);updUp()}
function persist(){if(!KEY)return;Q=Q.then(seal).catch(()=>flash('บันทึกในเครื่องนี้ไม่ได้ กรุณาสำรองลงไฟล์ทันที'))}
function updUp(){
 if(!ready)return;
 const t=+lsGet(BK)||0,d=t?Math.floor((Date.now()-t)/864e5):null,has=D.loans.length>0;
 const st=!t?'ยังไม่เคยสำรองลงไฟล์':'สำรองไฟล์ล่าสุด '+(d<=0?'วันนี้':d+' วันก่อน');
 const warn=has&&(!t||d>=7);
 $('up').textContent='บันทึกอัตโนมัติในเครื่องนี้ (เข้ารหัส) · '+(warn?'⚠ ':'')+st+(warn&&t?' ควรสำรองใหม่':'');
 $('up').style.color=warn?'var(--wn)':'';
}
function dl(txt,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function sendFile(txt,name){
 if(MOB){try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return false}}
 dl(txt,name);return true;
}
async function backupEnc(){
 if(!KEY)return;
 if(await sendFile(await pack(),'loan-data-'+todayS+'.json')){lsSet(BK,String(Date.now()));updUp();flash('สำรองไฟล์แล้ว (เข้ารหัส) เก็บไว้ใน iCloud Drive หรือ Google Drive ได้')}
}
function pickFile(){return new Promise((res,rej)=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
 i.onchange=()=>{const f=i.files[0];if(!f)return rej(new Error('cancel'));const r=new FileReader();r.onload=()=>res({name:f.name,text:String(r.result)});r.onerror=()=>rej(new Error('read'));r.readAsText(f)};
 i.oncancel=()=>rej(new Error('cancel'));i.click()})}
function arm(){clearTimeout(idle);if(DB||!KEY)return;idle=setTimeout(lock,300000)}
['click','keydown','touchstart','mousemove'].forEach(e=>addEventListener(e,()=>{if(KEY)arm()},{passive:true}));
async function openVault(v,pw){const sl=ub(v.s),k=await derive(pw,sl);const d=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(v.i)},k,ub(v.d))));return{k,sl,d}}
const wait=()=>new Promise(r=>setTimeout(r,Math.min(++fails,5)*1000));
function lockUI(msg){
 const first=!lsGet(VK);
 $('lk').innerHTML=`<div class="md"><div class="mb fm" style="max-width:420px"><h2 style="margin:0">🔒 ระบบสรุปสัญญาเงินให้กู้ยืม</h2>
 <div class="cal">${first?'ครั้งแรก: ตั้งรหัสผ่านอย่างน้อย 8 ตัวอักษร ข้อมูลจะบันทึกอัตโนมัติในเครื่องนี้แบบเข้ารหัส หากลืมรหัสผ่านจะกู้ข้อมูลไม่ได้ จึงควรสำรองลงไฟล์เป็นระยะ ถ้ามีไฟล์สำรองอยู่แล้ว ให้ใส่รหัสผ่านของไฟล์นั้นแล้วกด "เปิดจากไฟล์สำรอง"':'ใส่รหัสผ่านเพื่อเข้าใช้งาน หรือใส่รหัสผ่านของไฟล์แล้วกด "เปิดจากไฟล์สำรอง" เพื่อกู้ข้อมูลจากไฟล์'}</div>
 <label>รหัสผ่าน</label><input id="pw" type="password" autocomplete="${first?'new-password':'current-password'}" onkeydown="if(event.key=='Enter')go('${first?'new':'open'}')">
 ${first?`<label>ยืนยันรหัสผ่าน (ใช้เฉพาะตอนตั้งรหัสครั้งแรก)</label><input id="pw2" type="password" autocomplete="new-password" onkeydown="if(event.key=='Enter')go('new')">`:''}
 <div id="pe" class="cal" style="color:var(--er);min-height:18px;margin-top:6px">${msg||''}</div>
 <div class="ft"><button class="btn" onclick="go('file')">เปิดจากไฟล์สำรอง…</button><button class="btn p" onclick="go('${first?'new':'open'}')">${first?'ตั้งรหัสและเริ่มใช้งาน':'ปลดล็อก'}</button></div>
 ${first?'':`<div style="text-align:center;margin-top:10px"><button class="btn sm d" onclick="wipe()">ล้างข้อมูลในเครื่องนี้</button></div>`}</div></div>`;
 $('lk').style.display='';setTimeout(()=>$('pw').focus(),50);
}
function wipe(){
 if(!confirm('ลบข้อมูลที่เก็บในเครื่องนี้ทั้งหมด? ทำย้อนกลับไม่ได้ (ถ้ามีไฟล์สำรองจะกู้คืนได้)'))return;
 if(!confirm('ยืนยันอีกครั้ง: ลบข้อมูลในเครื่องนี้ทั้งหมด'))return;
 try{localStorage.removeItem(VK);localStorage.removeItem(BK)}catch(e){}
 lockUI('ล้างข้อมูลในเครื่องนี้แล้ว');
}
async function go(mode){
 const pw=$('pw').value,pe=$('pe');pe.textContent='';
 if(!(window.crypto&&crypto.subtle)){pe.textContent='เบราว์เซอร์นี้ไม่รองรับการเข้ารหัส (ต้องเปิดผ่านลิงก์ https)';return}
 if(!pw){pe.textContent='กรุณาใส่รหัสผ่านก่อน';return}
 if(mode==='new'){if(pw.length<8){pe.textContent='รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร';return}if(!$('pw2')||pw!==$('pw2').value){pe.textContent='รหัสผ่านไม่ตรงกัน';return}}
 const fp=mode==='file'?pickFile():null;
 try{
  if(mode==='new'){
   if(lsGet(VK)){pe.textContent='มีข้อมูลในเครื่องนี้อยู่แล้ว';return}
   SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(pw,SALT);D={lenders:[],loans:[]};
   await seal();
  }else if(mode==='open'){
   let v,r;
   try{v=JSON.parse(lsGet(VK))}catch(e){pe.textContent='ข้อมูลในเครื่องเสียหาย ให้ใช้ "เปิดจากไฟล์สำรอง"';return}
   try{r=await openVault(v,pw)}catch(e){await wait();pe.textContent='รหัสผ่านไม่ถูกต้อง';return}
   KEY=r.k;SALT=r.sl;D=r.d;
  }else{
   let f,v,r;
   try{f=await fp}catch(e){return}
   try{v=JSON.parse(f.text.replace(/^﻿/,''))}catch(e){pe.textContent='ไฟล์นี้ไม่ใช่ไฟล์สำรองที่ถูกต้อง';return}
   if(!(v&&v.s&&v.i&&v.d)){pe.textContent='ไฟล์นี้เป็นไฟล์ส่งออกแบบไม่เข้ารหัส ให้เริ่มใช้งานก่อน แล้วใช้ปุ่ม "นำเข้า" ในหน้าหลัก';return}
   try{r=await openVault(v,pw)}catch(e){await wait();pe.textContent='รหัสผ่านไม่ถูกต้อง (ต้องใช้รหัสผ่านของไฟล์สำรองนี้)';return}
   if(lsGet(VK)&&!confirm('ข้อมูลที่เก็บในเครื่องนี้จะถูกแทนที่ด้วยข้อมูลจากไฟล์สำรอง ดำเนินการต่อหรือไม่?'))return;
   KEY=r.k;SALT=r.sl;D=r.d;await seal();lsSet(BK,String(Date.now()));
  }
 }catch(e){KEY=null;SALT=null;ready=false;D={lenders:[],loans:[]};pe.textContent='เก็บข้อมูลในเครื่องนี้ไม่ได้ ('+((e&&e.name)||'error')+') ลองปิดโหมดส่วนตัวของเบราว์เซอร์';return}
 fails=0;$('lk').style.display='none';$('lk').innerHTML='';ready=true;
 $('lkb').style.display=$('cpb').style.display=$('svb').style.display='';
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 updUp();all();arm();
}
function lock(){
 if(DB||!ready)return;
 KEY=null;SALT=null;D={lenders:[],loans:[]};S.sel=null;S.q='';S.del=null;$('q').value='';$('mo').innerHTML='';
 ready=false;clearTimeout(idle);$('lkb').style.display=$('cpb').style.display=$('svb').style.display='none';$('up').textContent='';all();lockUI();
}
function chpw(){$('mo').innerHTML=`<div class="md"><div class="mb fm" style="max-width:360px"><h2 style="margin:0">เปลี่ยนรหัสผ่าน</h2><label>รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label><input id="np" type="password" autocomplete="new-password"><label>ยืนยันรหัสผ่านใหม่</label><input id="np2" type="password" autocomplete="new-password"><div id="ne" class="cal" style="color:var(--er);min-height:18px"></div><div class="ft"><button class="btn" onclick="$('mo').innerHTML=''">ยกเลิก</button><button class="btn p" onclick="setpw()">บันทึก</button></div></div></div>`}
async function setpw(){const a=$('np').value;if(a.length<8){$('ne').textContent='ต้องยาวอย่างน้อย 8 ตัวอักษร';return}if(a!==$('np2').value){$('ne').textContent='รหัสผ่านไม่ตรงกัน';return}SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(a,SALT);await seal();$('mo').innerHTML='';flash('เปลี่ยนรหัสผ่านแล้ว')}
function boot(){lockUI()}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=n=>Math.round(n||0).toLocaleString('th-TH');
const M=n=>'฿'+N(n);
const dt=s=>{if(!s)return '-';const[y,m,d]=s.split('-');return d+'/'+m+'/'+(+y+543)};
const days=(a,b)=>a&&b?Math.round((new Date(b)-new Date(a))/864e5):0;
const mons=(a,b)=>Math.round(days(a,b)/30.4375);
const tot=l=>Object.values(l.amt||{}).reduce((s,v)=>s+(+v||0),0);
const base=l=>{const mn=D.lenders.filter(x=>x.main).map(x=>x.n);const v=mn.reduce((s,n)=>s+(+(l.amt||{})[n]||0),0);return v||tot(l)};
const intr=(l,r)=>base(l)*(r.rate/100)*mons(r.start,r.end)/12;
const cur=l=>l.rounds.length?l.rounds[l.rounds.length-1]:null;
const todayS=new Date().toISOString().slice(0,10);
const left=l=>{const r=cur(l);return r?days(todayS,r.end):null};
function sumry(){
 const L=D.loans,act=L.filter(l=>l.status!=='ปิดบัญชี');
 const ann=act.reduce((s,l)=>{const r=cur(l);return s+(r?base(l)*r.rate/100:0)},0);
 const lit=L.filter(l=>l.status==='ดำเนินคดี').reduce((s,l)=>s+base(l),0);
 const fee=L.reduce((s,l)=>s+base(l)*(l.fee||0)/100,0);
 $('sum').innerHTML=[['จำนวนสัญญา',L.length+' สัญญา'],['เงินต้นรวมทุกผู้ให้กู้',M(L.reduce((s,l)=>s+tot(l),0))],['เงินต้นกลุ่มหลัก (คิดดอกเบี้ย)',M(L.reduce((s,l)=>s+base(l),0))],['ดอกเบี้ย/ปี (รอบล่าสุด)',M(ann)],['เงินปากถุงรวม',M(fee)],['อยู่ระหว่างดำเนินคดี',M(lit)]].map(([a,v])=>`<div class="k"><span>${a}</span><b>${v}</b></div>`).join('');
 $('chips').innerHTML=D.lenders.map(x=>{const t=L.reduce((s,l)=>s+(+(l.amt||{})[x.n]||0),0);return t?`<span class="chip ${x.main?'m':''}">${esc(x.n)}: <b>${M(t)}</b></span>`:''}).join('');
 $('fl').innerHTML=['ทั้งหมด',...ST].map(s=>`<button class="f ${S.f===s?'on':''}" onclick="S.f='${s}';list();sumry()">${s}${s==='ทั้งหมด'?'':' ('+L.filter(l=>l.status===s).length+')'}</button>`).join(' ');
 if(ready&&DB)$('up').textContent='ข้อมูลร่วม · ทุกคนที่มีสิทธิ์เห็นและแก้ไขชุดเดียวกัน · วันนี้ '+dt(todayS)+(RW?'':' · โหมดดูอย่างเดียว');
 $('addb').style.display=$('impb').style.display=RW?'':'none';
}
function match(l){
 if(S.f!=='ทั้งหมด'&&l.status!==S.f)return false;
 if(!S.q)return true;
 const t=[l.borrower,l.mort,l.note,(l.guar||[]).join(' '),Object.keys(l.amt||{}).filter(k=>l.amt[k]).join(' '),l.rounds.map(r=>r.method+r.chk+r.label).join(' ')].join(' ').toLowerCase();
 return S.q.toLowerCase().split(/\s+/).every(w=>t.includes(w));
}
function list(){
 const L=D.loans.filter(match);
 if(!ready){$('ls').innerHTML='<div class="em">กำลังโหลดข้อมูล…</div>';return}
 $('ls').innerHTML=L.length?L.map(l=>{const r=cur(l),d=left(l);
  const dd=d===null?'':d<0&&l.status!=='ปิดบัญชี'?`<span style="color:var(--er)">เกินกำหนด ${-d} วัน</span>`:d<=30&&l.status!=='ปิดบัญชี'?`<span style="color:var(--wn)">อีก ${d} วัน</span>`:'';
  return `<div class="it ${S.sel===l.id?'on':''}" onclick="S.sel='${l.id}';S.del=null;list();show()"><div class="m"><span>สัญญาที่ ${esc(l.no)}</span><span class="bd s-${l.status}">${l.status}</span></div><div class="t">${esc(l.borrower)}</div><div class="m"><b>${M(tot(l))}</b><span>${r?'ครบ '+dt(r.end):''} ${dd}</span></div></div>`}).join(''):(D.loans.length?'<div class="em">ไม่พบสัญญา</div>':'<div class="em">ไฟล์นี้ยังไม่มีข้อมูลสัญญา<br>กด <b>นำเข้า</b> เพื่อโหลดไฟล์สำรอง .json จากระบบเดิม<br>หรือกด <b>+ เพิ่มสัญญา</b> เพื่อเริ่มกรอกใหม่</div>');
}
function show(){
 const l=D.loans.find(x=>x.id===S.sel);
 if(!l){$('dt').innerHTML='<div class="pn em">เลือกสัญญาจากรายการด้านซ้ายเพื่อดูรายละเอียด</div>';return}
 const r=cur(l),b0=base(l),d=left(l),ent=Object.entries(l.amt||{}).filter(([,v])=>+v);
 const sec=(h,c)=>`<h3>${h}</h3>${c}`;
 $('dt').innerHTML=`<div class="pn"><div class="row"><div><span class="bd s-${l.status}">${l.status}</span> <span class="cal">สัญญาที่ ${esc(l.no)}</span><h2>${esc(l.borrower)}</h2></div>
 ${RW?`<div><button class="btn sm" onclick="edit('${l.id}')">แก้ไข</button> <button class="btn sm d" onclick="del('${l.id}')">${S.del===l.id?'กดอีกครั้งเพื่อลบ':'ลบ'}</button></div>`:''}</div>
 <div class="kv" style="margin-top:10px"><div><span>เงินต้นรวม</span><b>${M(tot(l))}</b></div><div><span>เงินต้นกลุ่มหลัก (ฐานดอกเบี้ย)</span><b>${M(b0)}</b></div>
 <div><span>ดอกเบี้ย/ปี (รอบล่าสุด)</span><b>${r?M(b0*r.rate/100):'-'}</b></div><div><span>เงินปากถุง ${l.fee||0}%</span><b>${M(b0*(l.fee||0)/100)}</b></div>
 <div><span>วันสิ้นสุดล่าสุด</span><b>${r?dt(r.end):'-'}${d!==null?(d<0?' (เกิน '+(-d)+' วัน)':' (อีก '+d+' วัน)'):''}</b></div></div>
 ${sec('เงินต้นแยกตามผู้ให้กู้',`<table class="tbl"><tbody>${ent.map(([n,v])=>`<tr><td>${esc(n)} ${(D.lenders.find(x=>x.n===n)||{}).main?'<span class="cal">(กลุ่มหลัก)</span>':''}</td><td>${M(v)}</td></tr>`).join('')||'<tr><td>-</td><td></td></tr>'}</tbody><tfoot><tr><td>รวม</td><td>${M(tot(l))}</td></tr></tfoot></table>`)}
 ${sec('รอบสัญญา / การขยาย ('+l.rounds.length+')',l.rounds.map((x,i)=>`<div class="rd ${i===l.rounds.length-1?'cur':''}"><div class="h"><span>${esc(x.label)}${i===l.rounds.length-1?' · ล่าสุด':''}</span><span>${dt(x.start)} → ${dt(x.end)}</span></div>
 <p><span>ระยะเวลา:</span> ${days(x.start,x.end)} วัน / ${mons(x.start,x.end)} เดือน · <span>ดอกเบี้ย:</span> ${x.rate}%/ปี = <b>${M(intr(l,x))}</b></p>
 <p><span>วันจ่ายดอกเบี้ย:</span> ${esc(x.payDay)||'-'}</p><p><span>วิธีจ่ายดอกเบี้ย:</span> ${esc(x.method)||'-'}</p><p><span>เช็คเงินต้น:</span> ${esc(x.chk)||'-'}</p></div>`).join('')||'<div class="cal">ยังไม่มีรอบสัญญา</div>')}
 ${sec('ผู้ค้ำประกัน',(l.guar||[]).length?'<div class="tx">'+l.guar.map(g=>'• '+esc(g)).join('\n')+'</div>':'<div class="cal">ไม่มี</div>')}
 ${sec('รายละเอียดสัญญาจำนอง',`<div class="tx">${esc(l.mort)||'-'}</div>`)}
 ${sec('NOTE',`<div class="tx nt">${esc(l.note)||'-'}</div>`)}</div>`;
}
function del(id){if(S.del!==id){S.del=id;show();return}S.sel=null;S.del=null;if(DB)wr(DB.doc('loans/'+id).delete());else{D.loans=D.loans.filter(x=>x.id!==id);persist()}all()}
let E;
function edit(id){
 const o=D.loans.find(x=>x.id===id);
 E=o?JSON.parse(JSON.stringify(o)):{id:'n'+Date.now(),no:Math.max(0,...D.loans.map(x=>+x.no||0))+1,borrower:'',status:'ปกติ',fee:0,amt:{},rounds:[],guar:[],mort:'',note:''};
 E._new=!o;fm();
}
function fm(){
 const v=(k,x)=>`value="${esc(x)}"`;
 $('mo').innerHTML=`<div class="md"><div class="mb fm"><h2 style="margin:0">${E._new?'เพิ่มสัญญาใหม่':'แก้ไขสัญญา'}</h2>
 <div class="g2"><div><label>สัญญาที่</label><input id="e_no" ${v('',E.no)}></div><div><label>สถานะ</label><select id="e_st">${ST.map(s=>`<option ${s===E.status?'selected':''}>${s}</option>`).join('')}</select></div><div><label>เงินปากถุง (%)</label><input id="e_fee" type="number" step="0.1" ${v('',E.fee)}></div></div>
 <label>ผู้กู้</label><textarea id="e_b" rows="2">${esc(E.borrower)}</textarea>
 <label>เงินต้นแยกตามผู้ให้กู้ (บาท)</label><div class="lg">${D.lenders.map((x,i)=>`<div><span class="cal">${esc(x.n)}${x.main?' ★':''}</span><input type="number" class="la" data-n="${esc(x.n)}" value="${E.amt[x.n]||''}"></div>`).join('')}</div>
 <div style="display:flex;gap:6px;margin-top:6px"><input id="nl" placeholder="เพิ่มชื่อผู้ให้กู้ใหม่"><button class="btn sm" onclick="addL()">เพิ่ม</button></div>
 <label>รอบสัญญา / การขยาย <span class="cal">(ระยะเวลาและดอกเบี้ยคำนวณอัตโนมัติจากวันที่)</span></label>
 ${E.rounds.map((x,i)=>`<div class="fr"><div class="g2"><div><label>ชื่อรอบ</label><input data-r="${i}" data-k="label" value="${esc(x.label)}"></div><div><label>เริ่ม</label><input type="date" data-r="${i}" data-k="start" value="${x.start}"></div><div><label>สิ้นสุด</label><input type="date" data-r="${i}" data-k="end" value="${x.end}"></div><div><label>ดอกเบี้ย %/ปี</label><input type="number" step="0.01" data-r="${i}" data-k="rate" value="${x.rate}"></div></div>
 <label>วันที่จ่ายดอกเบี้ย</label><input data-r="${i}" data-k="payDay" value="${esc(x.payDay)}"><label>วิธีจ่ายดอกเบี้ย</label><input data-r="${i}" data-k="method" value="${esc(x.method)}"><label>เช็คเงินต้น</label><input data-r="${i}" data-k="chk" value="${esc(x.chk)}">
 <div style="text-align:right;margin-top:6px"><button class="btn sm d" onclick="rm(${i})">ลบรอบนี้</button></div></div>`).join('')}
 <button class="btn sm" onclick="addR()">+ เพิ่มรอบสัญญา</button>
 <label>ผู้ค้ำประกัน (1 คนต่อบรรทัด)</label><textarea id="e_g" rows="3">${esc((E.guar||[]).join('\n'))}</textarea>
 <label>รายละเอียดสัญญาจำนอง</label><textarea id="e_m" rows="4">${esc(E.mort)}</textarea>
 <label>NOTE</label><textarea id="e_n" rows="4">${esc(E.note)}</textarea>
 <div class="ft"><button class="btn" onclick="$('mo').innerHTML=''">ยกเลิก</button><button class="btn p" onclick="ok()">บันทึก</button></div></div></div>`;
}
function grab(){
 E.no=$('e_no').value;E.status=$('e_st').value;E.fee=+$('e_fee').value||0;E.borrower=$('e_b').value;
 document.querySelectorAll('.la').forEach(i=>{if(+i.value)E.amt[i.dataset.n]=+i.value;else delete E.amt[i.dataset.n]});
 document.querySelectorAll('[data-r]').forEach(i=>{E.rounds[+i.dataset.r][i.dataset.k]=i.dataset.k==='rate'?+i.value:i.value});
 E.guar=$('e_g').value.split('\n').map(s=>s.trim()).filter(Boolean);E.mort=$('e_m').value;E.note=$('e_n').value;
}
function addR(){grab();const p=cur(E);E.rounds.push({label:'ขยายครั้งที่ '+E.rounds.length,start:p?p.end:'',end:'',rate:p?p.rate:15,payDay:p?p.payDay:'',method:'',chk:''});fm()}
function rm(i){grab();E.rounds.splice(i,1);fm()}
function addL(){grab();const n=$('nl').value.trim();if(n&&!D.lenders.some(x=>x.n===n)){D.lenders.push({n,main:0});saveLenders()}fm()}
function ok(){
 grab();if(!E.borrower.trim()){$('e_b').focus();return}
 const n=E._new;delete E._new;
 if(!DB){if(n)D.loans.push(E);else D.loans=D.loans.map(x=>x.id===E.id?E:x)}
 S.sel=E.id;saveLoan(E);$('mo').innerHTML='';all();
}
async function backup(){
 if(!confirm('ไฟล์ส่งออกนี้ไม่เข้ารหัส ใครได้ไปก็อ่านข้อมูลสัญญาได้ ต้องการส่งออกต่อหรือไม่?\n(ถ้าต้องการสำรองแบบปลอดภัย ให้ใช้ปุ่ม 💾 สำรองลงไฟล์)'))return;
 if(await sendFile(JSON.stringify(D,null,1),'loan-export-'+todayS+'.json'))flash('ส่งออกแล้ว (ไม่เข้ารหัส) เก็บรักษาให้ปลอดภัย');
}
function imp(i){
 const f=i.files[0];if(!f)return;const r=new FileReader();
 r.onerror=()=>flash('อ่านไฟล์ไม่ได้');
 r.onload=async()=>{try{
  let x=JSON.parse(String(r.result).replace(/^\uFEFF/,''));
  if(Array.isArray(x))x={loans:x};
  if(x.data&&x.data.loans)x=x.data;
  const loans=(x.loans||[]).map(l=>l.amtList?fromDoc(l):{...l,amt:l.amt||{},rounds:l.rounds||[],guar:l.guar||[]});
  if(!loans.length){flash('ไฟล์นี้ไม่มีสัญญาเลย (ไฟล์สำรองว่าง) ลองสำรองข้อมูลใหม่จากต้นทาง');return}
  if(D.loans.length&&!confirm('การนำเข้าจะแทนที่สัญญาทั้งหมดที่มีอยู่ในเครื่องนี้ ต้องการดำเนินการต่อหรือไม่?'))return;
  const lenders=x.lenders||[];
  loans.forEach((l,k)=>{if(!l.id)l.id='i'+Date.now()+k;Object.keys(l.amt||{}).forEach(n=>{if(!lenders.some(y=>y.n===n))lenders.push({n,main:0})})});
  if(!DB){D.lenders=lenders;D.loans=loans;persist();all();flash('นำเข้าแล้ว '+loans.length+' สัญญา');return}
  D.lenders=lenders;await saveLenders();for(const l of loans)await saveLoan(l);flash('นำเข้าแล้ว '+loans.length+' สัญญา')
 }catch(e){flash('นำเข้าไม่สำเร็จ: ไฟล์ไม่ใช่ JSON ที่ถูกต้อง')}};
 r.readAsText(f);i.value='';
}
function all(){sumry();list();show()}
all();boot();
</script>
</body>
</html>
